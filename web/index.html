<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1115" />
    <title>360 全景浏览</title>
    <link rel="stylesheet" href="/src/viewer/viewer.css" />
  </head>
  <body>
    <div id="projects-view" class="projects-view hidden">
      <div class="projects-header">
        <div class="projects-logo">360 全景</div>
        <div class="projects-subtitle">全景场景项目</div>
      </div>
      <div id="projects-grid" class="projects-grid"></div>
    </div>

    <div id="viewer" class="viewer hidden"></div>

    <div id="project-bar" class="project-bar hidden">
      <button id="btn-back" class="ctl-btn" title="返回项目列表">← 项目</button>
      <span id="project-name" class="project-name"></span>
    </div>

    <div id="loading" class="loading hidden">
      <div class="loading-bar"><div id="loading-fill" class="loading-fill"></div></div>
      <div class="loading-text" id="loading-text">加载中 0%</div>
    </div>

    <div id="scene-title" class="scene-title hidden"></div>

    <div id="scene-list" class="scene-list hidden"></div>

    <div id="controls" class="controls">
      <button id="btn-rotate" class="ctl-btn" title="自动旋转" aria-pressed="false">自动旋转</button>
      <button id="btn-gyro" class="ctl-btn hidden" title="陀螺仪" aria-pressed="false">陀螺仪</button>
      <button id="btn-fullscreen" class="ctl-btn" title="全屏">全屏</button>
    </div>

    <div id="error" class="error hidden"></div>

    <footer id="site-footer" class="site-footer hidden"></footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
