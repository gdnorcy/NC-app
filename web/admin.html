<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>360 全景管理后台</title>
    <link rel="stylesheet" href="/src/admin/admin.css" />
  </head>
  <body>
    <!-- 登录视图 -->
    <div id="login-view" class="view">
      <form id="login-form" class="login-card">
        <h1>360 全景管理后台</h1>
        <p class="login-sub">请登录后管理全景场景</p>
        <label class="field">
          <span>用户名</span>
          <input id="login-username" name="username" autocomplete="username" required />
        </label>
        <label class="field">
          <span>密码</span>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
        <p id="login-error" class="form-error hidden"></p>
      </form>
    </div>

    <!-- 管理视图 -->
    <div id="admin-view" class="view hidden">
      <header class="topbar">
        <h1>360 全景管理后台</h1>
        <div class="topbar-actions">
          <a class="btn btn-ghost" href="/" target="_blank">查看前台</a>
          <button id="btn-storage" class="btn btn-ghost">存储设置</button>
          <button id="btn-logout" class="btn btn-ghost">退出登录</button>
        </div>
      </header>

      <main class="content">
        <div class="toolbar">
          <button id="btn-add" class="btn btn-primary">+ 新增场景</button>
          <span id="scene-count" class="muted"></span>
        </div>

        <div class="table-wrap">
          <table class="scene-table">
            <thead>
              <tr>
                <th>预览</th>
                <th>标题 / 描述</th>
                <th>排序</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="scene-tbody"></tbody>
          </table>
        </div>
        <p id="admin-error" class="form-error hidden"></p>
      </main>
    </div>

    <!-- 场景编辑弹窗 -->
    <dialog id="scene-dialog">
      <form id="scene-form" class="dialog-card">
        <h2 id="dialog-title">新增场景</h2>
        <input type="hidden" id="f-id" />
        <input type="hidden" id="f-image-path" />
        <input type="hidden" id="f-preview-path" />

        <label class="field">
          <span>标题 *</span>
          <input id="f-title" required maxlength="50" placeholder="如：一楼客厅" />
        </label>

        <label class="field">
          <span>描述</span>
          <textarea id="f-desc" rows="2" maxlength="200" placeholder="选填，场景说明"></textarea>
        </label>

        <label class="field">
          <span>全景图（JPG / PNG / WebP，≤50MB）</span>
          <input id="f-file" type="file" accept="image/jpeg,image/png,image/webp" />
        </label>
        <div id="f-preview-wrap" class="preview-wrap hidden">
          <img id="f-preview" alt="全景图预览" />
        </div>
        <p id="f-upload-state" class="muted"></p>

        <div class="field-row">
          <label class="field">
            <span>排序值（小在前）</span>
            <input id="f-sort" type="number" value="0" />
          </label>
          <label class="checkbox-field">
            <input id="f-published" type="checkbox" checked />
            <span>上架</span>
          </label>
        </div>

        <div class="dialog-actions">
          <button type="button" id="dialog-cancel" class="btn btn-ghost">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </dialog>

    <!-- 存储设置弹窗 -->
    <dialog id="storage-dialog">
      <form id="storage-form" class="dialog-card">
        <h2>存储设置</h2>
        <p class="muted" style="margin-bottom:12px;">各云厂商独立配置、互不影响；保存哪个厂商即切换为当前存储，上传的图片将直传该厂商并走 CDN 加速。</p>

        <div class="storage-tabs" role="tablist">
          <button type="button" class="tab active" data-provider="local" role="tab">本地存储</button>
          <button type="button" class="tab" data-provider="oss" role="tab">阿里云 OSS</button>
          <button type="button" class="tab" data-provider="qiniu" role="tab">七牛云</button>
        </div>

        <!-- 本地存储 -->
        <div id="storage-pane-local" class="storage-pane">
          <p class="muted" style="padding:14px 0 4px;">图片保存在服务器磁盘（<code>server/data/uploads/</code>），无需额外配置，适合开发与内网环境。</p>
        </div>

        <!-- 阿里云 OSS -->
        <div id="storage-pane-oss" class="storage-pane" hidden>
          <label class="field">
            <span>AccessKey ID</span>
            <input id="oss-access-key" type="text" autocomplete="off" placeholder="子账号 AK，仅需该 Bucket 读写权限" />
          </label>
          <label class="field">
            <span>AccessKey Secret（保存时留空表示保持不变）</span>
            <input id="oss-secret-key" type="password" autocomplete="new-password" placeholder="已加密存储，不直接展示" />
          </label>
          <label class="field">
            <span>Region 区域</span>
            <input id="oss-region" type="text" autocomplete="off" placeholder="如 oss-cn-shenzhen" />
          </label>
          <label class="field">
            <span>Bucket</span>
            <input id="oss-bucket" type="text" autocomplete="off" placeholder="如 panorama-360" />
          </label>
          <label class="field">
            <span>文件夹前缀（可选）</span>
            <input id="oss-folder" type="text" autocomplete="off" placeholder="如 panorama，上传到该目录下" />
          </label>
          <label class="field">
            <span>CDN 域名（https:// 开头，不含结尾斜杠）</span>
            <input id="oss-cdn-domain" type="text" autocomplete="off" placeholder="https://img.yourdomain.com" />
          </label>
        </div>

        <!-- 七牛云 -->
        <div id="storage-pane-qiniu" class="storage-pane" hidden>
          <label class="field">
            <span>AccessKey</span>
            <input id="qiniu-access-key" type="text" autocomplete="off" placeholder="子账号 AK，仅需该空间读写权限" />
          </label>
          <label class="field">
            <span>SecretKey（保存时留空表示保持不变）</span>
            <input id="qiniu-secret-key" type="password" autocomplete="new-password" placeholder="已加密存储，不直接展示" />
          </label>
          <label class="field">
            <span>所属区域</span>
            <select id="qiniu-zone">
              <option value="">自动探测（推荐）</option>
              <option value="z0">华东（z0）</option>
              <option value="z1">华北（z1）</option>
              <option value="z2">华南（z2）</option>
              <option value="na0">北美（na0）</option>
              <option value="as0">东南亚（as0）</option>
            </select>
          </label>
          <label class="field">
            <span>空间名（Bucket）</span>
            <input id="qiniu-bucket" type="text" autocomplete="off" placeholder="如 panorama-360" />
          </label>
          <label class="field">
            <span>文件夹前缀（可选）</span>
            <input id="qiniu-folder" type="text" autocomplete="off" placeholder="如 panorama，上传到该目录下" />
          </label>
          <label class="field">
            <span>CDN 域名（https:// 开头，不含结尾斜杠）</span>
            <input id="qiniu-cdn-domain" type="text" autocomplete="off" placeholder="https://img.yourdomain.com" />
          </label>
        </div>

        <p id="s-msg" class="form-error hidden"></p>

        <div class="dialog-actions">
          <button type="button" id="s-test" class="btn btn-ghost">测试连接</button>
          <button type="button" id="s-cancel" class="btn btn-ghost">取消</button>
          <button type="submit" class="btn btn-primary">保存并启用</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/admin/admin.js"></script>
  </body>
</html>
